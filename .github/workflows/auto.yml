name: Run Discord quest bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: '13 17 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Install browser (if BROWSER_CLAIM)
        if: env.BROWSER_CLAIM == 'true'
        env:
          BROWSER_CLAIM: ${{ secrets.BROWSER_CLAIM }}
        run: npx playwright install chromium --with-deps

      - name: Setup virtual display for extension/non-headless (if needed)
        if: env.BROWSER_EXTENSION_PATH != '' || env.BROWSER_HEADLESS == 'false'
        env:
          BROWSER_EXTENSION_PATH: ${{ secrets.BROWSER_EXTENSION_PATH }}
          BROWSER_HEADLESS: ${{ secrets.BROWSER_HEADLESS }}
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "Xvfb started on :99"

      - name: Run bot
        env:
          TOKENS: ${{ secrets.TOKENS }}
          TOKEN: ${{ secrets.TOKEN }}
          BROWSER_CLAIM: ${{ secrets.BROWSER_CLAIM }}
          BROWSER_HEADLESS: ${{ secrets.BROWSER_HEADLESS }}
          BROWSER_EXTENSION_PATH: ${{ secrets.BROWSER_EXTENSION_PATH }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run github

      - name: Clear old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "Deleting old run: $run_id"
              gh run delete $run_id || true
            fi
          done
          echo "Cleanup done — only latest run kept."

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
