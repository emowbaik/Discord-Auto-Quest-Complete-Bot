<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Discord Auto Quest Complete Bot repository infographic</title>
  <desc id="desc">Architecture pipeline: inputs, Discord client, quest engine, captcha providers, reward claim, notifications, and operations safety.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#edf4ff"/><stop offset="1" stop-color="#dce8f8"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f9ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#23395d" flood-opacity="0.16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b73a8"/></marker>
    <style>
      .bg{fill:url(#bg)}.card{fill:url(#card);stroke:#d4deef;stroke-width:1.4;filter:url(#shadow)}.title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:850;font-size:50px;fill:#15233f;letter-spacing:-.7px}.sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;fill:#52627f}.h{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;font-size:24px;fill:#172640}.t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;fill:#53637e}.b{fill:#edf4ff;stroke:#c8d7ee}.bt{font-family:Consolas,Menlo,monospace;font-size:14px;fill:#29456f}.p{fill:#2f64d6}.pt{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:750;font-size:15px;fill:#fff}.warn{fill:#fff4df;stroke:#ead3a1}.wt{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#7a5a12}.a{stroke:#5b73a8;stroke-width:3;fill:none;marker-end:url(#arrow)}.ta{stroke:#8ca1c7;stroke-width:2;fill:none;marker-end:url(#arrow)}.f{fill:#16213a}.ft{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:750;font-size:18px;fill:#e9f1ff}.n{fill:#e9f1ff;stroke:#9eb4dd;stroke-width:2}.num{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;font-size:18px;fill:#2f64d6}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><circle cx="1420" cy="115" r="190" fill="#fff" opacity=".34"/><circle cx="130" cy="790" r="220" fill="#fff" opacity=".28"/>
  <text x="80" y="82" class="title">Discord Auto Quest Complete Bot</text><text x="82" y="119" class="sub">Token input → Discord quest automation → captcha provider → reward claim → reports</text>
  <rect x="70" y="170" width="210" height="225" rx="30" class="card"/><circle cx="108" cy="210" r="19" class="n"/><text x="102" y="216" class="num">1</text><text x="135" y="218" class="h">Inputs</text><text x="100" y="260" class="t">• TOKENS / TOKEN</text><text x="100" y="292" class="t">• .env secrets</text><text x="100" y="324" class="t">• GitHub schedule</text><text x="100" y="356" class="t">• Manual run</text><rect x="94" y="415" width="154" height="34" rx="12" class="b"/><text x="109" y="437" class="bt">bot.ts</text>
  <rect x="350" y="160" width="255" height="245" rx="30" class="card"/><circle cx="388" cy="200" r="19" class="n"/><text x="382" y="206" class="num">2</text><text x="415" y="208" class="h">Discord Client</text><text x="385" y="252" class="t">Gateway login + Ready</text><text x="385" y="284" class="t">REST /quests/@me</text><text x="385" y="316" class="t">Desktop headers + build</text><text x="385" y="348" class="t">Rate-limit logging</text><rect x="382" y="425" width="190" height="34" rx="12" class="b"/><text x="397" y="447" class="bt">src/client.ts</text>
  <rect x="675" y="145" width="300" height="360" rx="34" class="card"/><circle cx="715" cy="187" r="19" class="n"/><text x="709" y="193" class="num">3</text><text x="742" y="195" class="h">Quest Engine</text><text x="715" y="238" class="t">Auto-enroll /quests/{id}/enroll</text><text x="715" y="270" class="t">Task detection switch</text><text x="715" y="302" class="t">Video progress spoof</text><text x="715" y="334" class="t">Heartbeat spoof</text><text x="715" y="366" class="t">Discord Says OAuth</text><text x="715" y="398" class="t">Claimable filter + retry</text><rect x="712" y="425" width="230" height="34" rx="12" class="b"/><text x="727" y="447" class="bt">src/questManager.ts</text><rect x="712" y="468" width="138" height="34" rx="12" class="b"/><text x="727" y="490" class="bt">src/quest.ts</text>
  <rect x="1045" y="155" width="245" height="285" rx="30" class="card"/><circle cx="1083" cy="196" r="19" class="n"/><text x="1077" y="202" class="num">4</text><text x="1110" y="204" class="h">Captcha</text><text x="1082" y="248" class="t">NoneCap preferred</text><text x="1082" y="280" class="t">hcaptcha enterprise</text><text x="1082" y="312" class="t">rqdata + sticky proxy</text><text x="1082" y="344" class="t">NopeCHA fallback</text><rect x="1078" y="365" width="178" height="34" rx="12" class="p"/><text x="1096" y="387" class="pt">P1 token output</text><rect x="1078" y="462" width="188" height="34" rx="12" class="b"/><text x="1093" y="484" class="bt">src/captcha.ts</text><rect x="1078" y="505" width="198" height="30" rx="11" class="b"/><text x="1090" y="525" class="bt">providers/nonecap.ts</text><rect x="1078" y="540" width="198" height="30" rx="11" class="b"/><text x="1090" y="560" class="bt">providers/nopecha.ts</text>
  <rect x="1330" y="170" width="210" height="225" rx="30" class="card"/><circle cx="1368" cy="210" r="19" class="n"/><text x="1362" y="216" class="num">5</text><text x="1395" y="218" class="h">Rewards</text><text x="1360" y="262" class="t">Claim reward</text><text x="1360" y="294" class="t">Captcha retry</text><text x="1360" y="326" class="t">Success count</text><rect x="1355" y="350" width="156" height="34" rx="12" class="b"/><text x="1370" y="372" class="bt">claim-reward</text>
  <rect x="1095" y="565" width="330" height="180" rx="30" class="card"/><circle cx="1134" cy="605" r="19" class="n"/><text x="1128" y="611" class="num">6</text><text x="1161" y="613" class="h">Notifications</text><text x="1132" y="657" class="t">Telegram HTML report</text><text x="1132" y="689" class="t">Discord webhook embed</text><text x="1132" y="721" class="t">WIB timestamp + escaped text</text><rect x="1312" y="708" width="92" height="34" rx="12" class="b"/><text x="1327" y="730" class="bt">notify.ts</text>
  <rect x="350" y="575" width="555" height="170" rx="30" class="card"/><circle cx="388" cy="615" r="19" class="n"/><text x="382" y="621" class="num">7</text><text x="415" y="623" class="h">Ops and Safety</text><text x="385" y="667" class="t">SECURITY.md audit · no raw token logs · webhook is bearer secret</text><text x="385" y="699" class="t">GitHub Actions keepalive reduces disabled cron risk</text><rect x="382" y="718" width="238" height="34" rx="12" class="b"/><text x="397" y="740" class="bt">.github/workflows/auto.yml</text><rect x="640" y="718" width="126" height="34" rx="12" class="b"/><text x="655" y="740" class="bt">SECURITY.md</text>
  <rect x="70" y="575" width="210" height="170" rx="24" class="warn"/><text x="98" y="625" class="h">Risk Note</text><text x="98" y="665" class="wt">User-token selfbot</text><text x="98" y="692" class="wt">violates Discord ToS.</text><text x="98" y="719" class="wt">Use at own risk.</text>
  <path d="M280 282C315 282 318 282 350 282" class="a"/><path d="M605 282C640 282 640 282 675 282" class="a"/><path d="M975 300C1012 300 1012 300 1045 300" class="a"/><path d="M1290 280C1310 280 1310 280 1330 280" class="a"/><path d="M1435 395C1435 485 1395 520 1325 565" class="ta"/><path d="M1190 440C1150 500 1130 535 1130 565" class="ta"/><path d="M825 505C825 545 720 560 675 575" class="ta"/>
  <rect x="70" y="815" width="1470" height="54" rx="20" class="f"/><text x="105" y="850" class="ft">Node 24 · TypeScript · undici · GitHub Actions · NoneCap · NopeCHA · Telegram · Discord Webhooks</text>
</svg>
